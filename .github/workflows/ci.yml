name: CI/CD

env:
  GO_VERSION: "1.26"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    # A cap, not a budget: the job normally finishes in 2-3 minutes. It
    # exists so a hung step fails visibly instead of burning the 360-minute
    # default, which is what an apt mirror stall did twice in a row.
    timeout-minutes: 20
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest ]
    steps:
    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ env.GO_VERSION }}
        check-latest: true # setup-go's manifest lags fresh Go patch releases; resolve via go.dev
        cache: true

    # Linux only, and that is a finding rather than a shortcut: a bash built
    # on the macOS runner hangs TestCompatScoreboard, which normally takes
    # twelve seconds and instead burned the package's whole ten-minute budget.
    # Putting a fresh bash first on PATH changes the oracle for every test that
    # shells out, not just the differential ones, so the blast radius is wider
    # than the intent. Linux gets the oracle and is the canonical generator;
    # macOS keeps its system bash and skips the differential suite as before.
    # Tracked in #280.
    #
    # Both differential harnesses compare against a *specific* bash, and
    # neither runner ships it (#273). interp's TestRunnerRunConfirm skips
    # itself entirely when $BASH_VERSION is not 5.3, which is how it went
    # unnoticed that the suite had never once run in CI; the bash-suite
    # scoreboard wants the same binary as its oracle. Cached on the version,
    # so the build is paid for once per runner image.
    - name: Cache bash 5.3
      id: bash-cache
      if: runner.os == 'Linux'
      uses: actions/cache@v4
      with:
        path: build/bash-bin
        key: bash-5.3-${{ runner.os }}-${{ runner.arch }}

    - name: Build bash 5.3
      if: runner.os == 'Linux' && steps.bash-cache.outputs.cache-hit != 'true'
      run: ./scripts/build-bash.sh

    - name: Put bash 5.3 ahead of the system bash
      if: runner.os == 'Linux'
      run: |
        echo "$PWD/build/bash-bin" >> "$GITHUB_PATH"

    - name: Confirm the differential suites have their oracle
      if: runner.os == 'Linux'
      run: |
        bash --version | head -1
        test "$(bash -c 'echo -n $BASH_VERSION' | cut -d. -f1,2)" = "5.3" \
          || { echo "bash 5.3 is not first on PATH; the differential suites would silently skip"; exit 1; }

    - name: Run tests
      run: make test

    # The published compat claim must stay true (#101): the corpus is
    # run differentially against the runner's real bash.
    - name: Bash-compat scoreboard
      run: make compat-check

    # bash's own suite is published rather than gated on its pass rate — that
    # is deliberate, and stays that way (#274). What runs here is the harness
    # sanity check, which catches the failure that would otherwise read as a
    # compatibility collapse: a broken fetch or missing helpers make every
    # file produce nothing, and "koi got worse" is the wrong conclusion to
    # draw from that. The run also logs its delta against the published page,
    # so drift is visible without being enforced. Linux only: two shells over
    # 83 files is a couple of minutes, and one runner answers the question.
    - name: Bash's own test suite (harness sanity, and the published delta)
      if: runner.os == 'Linux'
      run: make bash-suite-check

    # The ecosystem matrix (#159) is only meaningful against tools that
    # are actually there, so the runner gets a few of them. Best-effort
    # by design (`|| true`): what is missing is reported as missing
    # rather than skipped silently. Each command is also time-bounded,
    # because best-effort has to include not hanging — `apt-get update`
    # stalled here for 14 minutes with no output, twice, and a step that
    # cannot fail but can hang is a step that only hangs.
    - name: Install ecosystem tools for the matrix
      if: runner.os == 'Linux'
      run: |
        timeout 180 sudo apt-get update -qq || true
        timeout 180 sudo apt-get install -y -qq fzf direnv zoxide || true
        curl -fsS --max-time 120 https://starship.rs/install.sh | sh -s -- --yes || true
        # oh-my-posh is the other cross-shell prompt, and its init is a
        # harder test than starship's: a two-stage bootstrap ending in
        # PS0, a PROMPT_COMMAND array and PS1 holding a command
        # substitution. Its own installer, into a dir already on PATH.
        curl -fsS --max-time 120 https://ohmyposh.dev/install.sh | sudo bash -s -- -d /usr/local/bin || true

    # The #1 abandonment cause, gated (#161): text pasted at a real
    # interactive prompt, the named init scripts sourced unmodified, and
    # the ecosystem matrix (#159). Unix only — it drives koi on a pty.
    - name: Paste, source and ecosystem gates
      if: runner.os != 'Windows'
      run: make paste-gate-check

  # Windows is a target, not a port (#47): everything must build, and
  # the portable packages must pass on a real Windows runner. The
  # unix-only surfaces (job control, sandbox enforcement, pty tests)
  # are build-tagged out; porting their test suites tracks in #47.
  test-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ env.GO_VERSION }}
        check-latest: true # setup-go's manifest lags fresh Go patch releases; resolve via go.dev
        cache: true

    - name: Build everything
      run: go build ./...

    # `go build` skips _test.go, so a unix-only test file in an otherwise
    # portable package compiled fine here and broke anyone vetting for
    # Windows. vet type-checks tests too, across every package — not just
    # the portable list below.
    - name: Vet everything (test files included)
      run: go vet ./...

    # The list grows as packages become portable, and adding one is how
    # the port stays a resume rather than a restart (#43, sequenced to
    # v1.x by #110). A package that builds for Windows but is never run
    # there is a claim, not a guarantee — the same distinction the
    # builtin matrices exist to close.
    - name: Run portable tests
      run: go test -race ./internal/term/ ./internal/complete/ ./internal/editor/ ./internal/history/ ./internal/envtrust/ ./internal/tools/ ./internal/sandbox/ ./internal/pluginhost/ ./internal/repl/ ./internal/builtins/ ./internal/remote/ ./internal/session/ ./internal/capture/ ./internal/blocks/ ./internal/promptengine/ ./internal/gitstatus/ ./internal/dirjump/ ./internal/manifest/ ./internal/ui/ ./internal/jobs/ ./cmd/koi-aws/ ./cmd/koi-atuin/ ./cmd/koi-claude/ ./cmd/koi-direnv/ ./internal/migrate/

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ env.GO_VERSION }}
        check-latest: true # setup-go's manifest lags fresh Go patch releases; resolve via go.dev
        cache: true

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: latest
        args: --timeout=10m

  build:
    runs-on: ubuntu-latest
    needs: [ test, lint ]
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ env.GO_VERSION }}
        check-latest: true # setup-go's manifest lags fresh Go patch releases; resolve via go.dev
        cache: true

    - name: Build
      run: make build

    - name: Cross-compile all release targets
      run: |
        GOOS=windows GOARCH=amd64 go build ./...
        GOOS=linux GOARCH=arm64 go build ./...
        GOOS=darwin GOARCH=amd64 go build ./...
