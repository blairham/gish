name: CI/CD

env:
  GO_VERSION: "1.26"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest ]
    steps:
    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ env.GO_VERSION }}
        check-latest: true # setup-go's manifest lags fresh Go patch releases; resolve via go.dev
        cache: true

    - name: Run tests
      run: make test

    # The published compat claim must stay true (#101): the corpus is
    # run differentially against the runner's real bash.
    - name: Bash-compat scoreboard
      run: make compat-check

    # The ecosystem matrix (#159) is only meaningful against tools that
    # are actually there, so the runner gets a few of them. What is
    # missing is reported as missing rather than skipped silently.
    - name: Install ecosystem tools for the matrix
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq fzf direnv zoxide || true
        curl -sS https://starship.rs/install.sh | sh -s -- --yes || true

    # The #1 abandonment cause, gated (#161): text pasted at a real
    # interactive prompt, the named init scripts sourced unmodified, and
    # the ecosystem matrix (#159). Unix only — it drives gish on a pty.
    - name: Paste, source and ecosystem gates
      if: runner.os != 'Windows'
      run: make paste-gate-check

  # Windows is a target, not a port (#47): everything must build, and
  # the portable packages must pass on a real Windows runner. The
  # unix-only surfaces (job control, sandbox enforcement, pty tests)
  # are build-tagged out; porting their test suites tracks in #47.
  test-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ env.GO_VERSION }}
        check-latest: true # setup-go's manifest lags fresh Go patch releases; resolve via go.dev
        cache: true

    - name: Build everything
      run: go build ./...

    # `go build` skips _test.go, so a unix-only test file in an otherwise
    # portable package compiled fine here and broke anyone vetting for
    # Windows. vet type-checks tests too, across every package — not just
    # the portable list below.
    - name: Vet everything (test files included)
      run: go vet ./...

    # The list grows as packages become portable, and adding one is how
    # the port stays a resume rather than a restart (#43, sequenced to
    # v1.x by #110). A package that builds for Windows but is never run
    # there is a claim, not a guarantee — the same distinction the
    # builtin matrices exist to close.
    - name: Run portable tests
      run: go test -race ./internal/term/ ./internal/complete/ ./internal/editor/ ./internal/history/ ./internal/envtrust/ ./internal/tools/ ./internal/sandbox/ ./internal/pluginhost/ ./internal/repl/ ./internal/builtins/ ./internal/remote/ ./internal/session/ ./internal/capture/ ./internal/blocks/ ./internal/p10k/ ./internal/gitstatus/ ./internal/dirjump/ ./internal/manifest/ ./internal/ui/ ./internal/jobs/ ./cmd/gish-aws/ ./cmd/gish-atuin/ ./cmd/gish-claude/ ./cmd/gish-direnv/ ./internal/migrate/

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ env.GO_VERSION }}
        check-latest: true # setup-go's manifest lags fresh Go patch releases; resolve via go.dev
        cache: true

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: latest
        args: --timeout=10m

  build:
    runs-on: ubuntu-latest
    needs: [ test, lint ]
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ env.GO_VERSION }}
        check-latest: true # setup-go's manifest lags fresh Go patch releases; resolve via go.dev
        cache: true

    - name: Build
      run: make build

    - name: Cross-compile all release targets
      run: |
        GOOS=windows GOARCH=amd64 go build ./...
        GOOS=linux GOARCH=arm64 go build ./...
        GOOS=darwin GOARCH=amd64 go build ./...
