// EnvProvider — direnv-class per-directory environment diffs (#12).
//
// On directory change the host asks env plugins for a diff. The trust
// model is the contract's core, enforced host-side:
//
//   - Nothing ever applies silently. A proposed diff applies only after
//     the user runs `trust allow`, which records (plugin, for_dir,
//     diff-hash). Any change to the proposal — a different hash —
//     re-pends and re-prompts, direnv's edit-reprompts semantics.
//   - A deny-list of variables no plugin may set (loader hooks like
//     LD_PRELOAD/DYLD_*, IFS, shell-internal GISH_*) is stripped
//     host-side before a diff is even proposed. PATH is settable, but
//     only ever through the visible allow flow above.
//   - Requests carry the allowlisted env subset, never the full
//     environment (the filtered-env invariant).
//
// Budget: EnvDiff is bounded (100ms default). A miss skips the diff for
// this prompt and retries on the next one — the prompt never waits.
syntax = "proto3";

package gish.plugin.v1;

option go_package = "github.com/blairham/gish/pkg/pluginapi/v1;pluginapi";

service EnvProvider {
  // EnvDiff proposes environment changes for a directory. An empty
  // response (no for_dir) means the plugin has nothing for this cwd.
  rpc EnvDiff(EnvDiffRequest) returns (EnvDiffResponse);

  // Allow tells the plugin the user approved this directory, so a
  // plugin wrapping a tool with its *own* approval model can satisfy it
  // in the same gesture (#137).
  //
  // The motivating case is direnv: it has `direnv allow`, and gish has
  // the trust flow above. Prompting twice for one action is
  // unacceptable, and letting the wrapped tool's prompt replace gish's
  // would give up the host-enforced guarantees. So `trust allow` calls
  // this first, then re-asks for the diff.
  //
  // Optional: a plugin with no second trust model returns unimplemented
  // (or an empty response) and the host carries on. Never called
  // without an explicit user approval — this is not a way to
  // pre-authorize anything.
  rpc Allow(AllowRequest) returns (AllowResponse);
}

message EnvDiffRequest {
  // Directory just entered.
  string cwd = 1;
  // Filtered environment. The host sends an allowlisted subset, never
  // the full environment — env plugins do not see secrets by default.
  map<string, string> env = 2;
  // Monotonic per-session sequence number; lets plugins drop stale
  // requests that were superseded before they were served.
  uint64 event_seq = 3;
}

message EnvDiffResponse {
  // Directory this diff derives from (e.g. where the .envrc-equivalent
  // lives). Must be cwd or an ancestor of it — anything else is
  // discarded. Trust is keyed on it, and the diff stays applied for
  // any cwd underneath it until the shell leaves that subtree.
  string for_dir = 1;
  // Variables to set (name → value). Deny-listed names are stripped by
  // the host.
  map<string, string> set = 2;
  // Variables to unset. Same deny-list applies.
  repeated string unset = 3;
}

message AllowRequest {
  // The directory the user approved — the for_dir of the diff they were
  // shown, never an arbitrary path.
  string for_dir = 1;
  // Same filtered environment EnvDiffRequest carries.
  map<string, string> env = 2;
}

message AllowResponse {
  // False means the plugin could not record the approval (the wrapped
  // tool failed, or is missing). The host still applies the diff it
  // showed — gish's own trust record is authoritative for gish — but it
  // says so, because the next shell may see the proposal again.
  bool recorded = 1;
  // Optional one-line explanation for the user when recorded is false.
  string detail = 2;
}
