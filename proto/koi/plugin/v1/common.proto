// Tier-2 native plugin API — shared types and the discovery service.
//
// Koi plugins are resident subprocesses speaking gRPC via
// hashicorp/go-plugin. The host launches a plugin lazily on first use,
// performs the go-plugin handshake (see internal/pluginhost), then calls
// Describe once to learn which capability services the plugin serves on
// the same connection. A plugin may implement any subset.
//
// Contract rules (the reason this tier exists):
//   - This protobuf surface is versioned: breaking changes mean a new
//     koi.plugin.v2 package, never an edit to v1.
//   - Every host→plugin call carries a deadline. A plugin that misses it
//     is skipped for that interaction, not waited on — a slow plugin must
//     never block a keystroke or a prompt.
syntax = "proto3";

package koi.plugin.v1;

option go_package = "github.com/blairham/koi-shell/pkg/pluginapi/v1;pluginapi";

// Capability names the services a plugin implements.
enum Capability {
  CAPABILITY_UNSPECIFIED = 0;
  CAPABILITY_COMPLETION = 1;      // CompletionProvider
  CAPABILITY_PROMPT_SEGMENT = 2;  // PromptSegmentProvider
  CAPABILITY_HISTORY = 3;         // HistoryBackend
  CAPABILITY_COMMAND = 4;         // CommandProvider (#11)
  CAPABILITY_THEME = 5;           // ThemeProvider (#30)
  CAPABILITY_ENV = 6;             // EnvProvider (#12)
  CAPABILITY_AI = 7;              // AIProvider (#20)
  CAPABILITY_EVENTS = 8;          // ShellEvents (#83) — contract only, not served yet
}

// PluginInfo is the one service every plugin must implement.
service PluginInfo {
  // Describe is called once per plugin process, immediately after the
  // go-plugin handshake succeeds.
  rpc Describe(DescribeRequest) returns (DescribeResponse);
}

message DescribeRequest {}

message DescribeResponse {
  // Machine name, unique per plugin (e.g. "git-prompt"). Used in
  // configuration and diagnostics.
  string name = 1;
  // Plugin's own version string, informational only.
  string version = 2;
  // Which capability services this plugin serves.
  repeated Capability capabilities = 3;
}
