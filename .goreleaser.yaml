version: 2

# GoReleaser configuration for koi
# See: https://goreleaser.com
project_name: koi

builds:
- id: koi
  binary: koi
  main: ./cmd/koi
  env:
  - CGO_ENABLED=0
  goos:
  - linux
  - darwin
  - windows
  goarch:
  - amd64
  - arm64
  ldflags:
  - -s -w
  - -X main.version={{.Version}}
  - -X main.commit={{.Commit}}
  - -X main.date={{.Date}}

# Tier-2 plugins ship alongside the shell; installing is dropping them
# into $XDG_DATA_HOME/koi/plugins.
- id: koi-git
  binary: koi-git
  main: ./cmd/koi-git
  env:
  - CGO_ENABLED=0
  goos:
  - linux
  - darwin
  - windows
  goarch:
  - amd64
  - arm64
  ldflags:
  - -s -w

- id: koi-carapace
  binary: koi-carapace
  main: ./cmd/koi-carapace
  env:
  - CGO_ENABLED=0
  goos:
  - linux
  - darwin
  - windows
  goarch:
  - amd64
  - arm64
  ldflags:
  - -s -w

archives:
- id: default
  formats:
  - tar.gz
  # this name template makes the OS and Arch compatible with the results of uname.
  name_template: >-
    {{ .ProjectName }}_ {{- title .Os }}_ {{- if eq .Arch "amd64" }}x86_64 {{- else }}{{ .Arch }}{{ end }}
  format_overrides:
  - goos: windows
    formats:
    - zip

# macOS signing + notarization, matching ghorg, stevedore and go-pre-commit.
# Gated on isEnvSet, so releases still succeed unsigned when the secrets are
# absent — which is the case until MACOS_SIGN_P12 and the notary key are added
# to this repo.
notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'
      ids:
        - koi
      sign:
        certificate: "{{.Env.MACOS_SIGN_P12}}"
        password: "{{.Env.MACOS_SIGN_PASSWORD}}"
      notarize:
        issuer_id: "{{.Env.MACOS_NOTARY_ISSUER_ID}}"
        key_id: "{{.Env.MACOS_NOTARY_KEY_ID}}"
        key: "{{.Env.MACOS_NOTARY_KEY}}"
        wait: true

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  groups:
  - title: Features
    regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
    order: 0
  - title: Bug Fixes
    regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
    order: 1
  - title: Other
    order: 999
  filters:
    exclude:
    - '^docs:'
    - '^test:'
    - '^chore:'

# Formula, matching the tap convention (blairham/homebrew-tap ships
# Formula/, not Casks/ — cswap, ghorg, pre-commit, stevedore all do this).
# Formulas don't get Gatekeeper-quarantined, so no xattr hook is needed.
brews:
- name: koi
  # Skip the tap push until HOMEBREW_TAP_TOKEN exists as a repo secret;
  # the GitHub release itself still publishes.
  skip_upload: '{{ if isEnvSet "HOMEBREW_TAP_TOKEN" }}false{{ else }}true{{ end }}'
  repository:
    owner: blairham
    name: homebrew-tap
    token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
  directory: Formula
  homepage: https://github.com/blairham/koi-shell
  description: "Interactive shell: zsh ergonomics, bash compatibility, gRPC-native plugins"
  license: MIT
  install: |
    bin.install "koi"
    bin.install "koi-git"
    bin.install "koi-carapace"
  caveats: |
    To use koi as your login shell:
      echo "#{opt_bin}/koi" | sudo tee -a /etc/shells
      chsh -s "#{opt_bin}/koi"

    The bundled tier-2 plugins activate once linked into the plugin dir:
      mkdir -p "${XDG_DATA_HOME:-$HOME/.local/share}/koi/plugins"
      ln -sf "#{opt_bin}/koi-git" "#{opt_bin}/koi-carapace" "${XDG_DATA_HOME:-$HOME/.local/share}/koi/plugins/"
  test: |
    system "#{bin}/koi", "--version"

# Windows distribution (#89). Both mirror the homebrew-tap pattern: the
# upload is skipped unless its token exists, so a release from a machine
# without the secrets still publishes the GitHub release itself.
scoops:
- name: koi
  skip_upload: '{{ if isEnvSet "SCOOP_BUCKET_TOKEN" }}false{{ else }}true{{ end }}'
  repository:
    owner: blairham
    name: scoop-bucket
    token: "{{ .Env.SCOOP_BUCKET_TOKEN }}"
  homepage: https://github.com/blairham/koi-shell
  description: "Interactive shell: zsh ergonomics, bash compatibility, native plugins"
  license: MIT

winget:
- name: koi
  publisher: blairham
  short_description: "Interactive shell: zsh ergonomics, bash compatibility, native plugins"
  license: MIT
  homepage: https://github.com/blairham/koi-shell
  # winget's manifests are a PR against microsoft/winget-pkgs, so this
  # needs a fork to push the branch to and a token that can open it.
  skip_upload: '{{ if isEnvSet "WINGET_TOKEN" }}false{{ else }}true{{ end }}'
  publisher_url: https://github.com/blairham
  package_identifier: blairham.koi
  repository:
    owner: blairham
    name: winget-pkgs
    branch: "koi-{{ .Version }}"
    token: "{{ .Env.WINGET_TOKEN }}"
    pull_request:
      enabled: true
      draft: false
      base:
        owner: microsoft
        name: winget-pkgs
        branch: master

release:
  draft: false
  replace_existing_draft: true
  target_commitish: "{{ .Commit }}"
  prerelease: auto
  mode: replace
  # A workflow_dispatch re-release of an existing tag must overwrite the
  # assets, not 422 on already_exists (bit us on v0.0.0).
  replace_existing_artifacts: true
  footer: |
    **Full Changelog**: https://github.com/blairham/koi-shell/compare/{{ .PreviousTag }}...{{ .Tag }}
